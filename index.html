<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For My Dearest Mohit 💘</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Arrow Element -->
    <div class="arrow" id="arrow">🏹</div>
    <div class="arrow-trail"></div>
    
    <!-- Broken Heart Pieces -->
    <div class="heart-piece" id="piece1">💔</div>
    <div class="heart-piece" id="piece2">💔</div>
    <div class="heart-piece" id="piece3">💔</div>
    
    <!-- Main Card -->
    <div class="card" id="card">
        <div class="heart-container">
            <div class="heart" id="heart">💖</div>
            <div class="heart-shadow"></div>
        </div>

        <h1 class="title">Hey Mohit... ❤️</h1>

        <p class="line">
            Are you Wi-Fi? 🤔 <br>
            <span class="highlight">Because I'm feeling a strong connection!</span>
        </p>

        <p class="question" id="message">
            Will you be my Valentine? 🌹
        </p>

        <div class="buttons">
            <button class="yes">
                <span class="btn-text">YES! 💖</span>
                <span class="btn-sparkles">✨</span>
            </button>
            <button class="no">
                <span class="btn-text">NO! 🙈</span>
                <span class="btn-sad">😔</span>
            </button>
        </div>

        <div class="footer">
            Made with ❤️ & a bit of mischief
        </div>
    </div>

    <!-- Full Screen Girl Image -->
    <img src="assets/girl.jpg" id="girl" class="girl-image">

    <!-- Music -->
    <audio id="sadMusic" src="assets/sad-music.mp3"></audio>
    <audio id="heartSound" src="assets/heartbeat.mp3"></audio>
    <audio id="arrowSound" src="assets/arrow-shot.mp3"></audio>
    <audio id="breakSound" src="assets/glass-break.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
